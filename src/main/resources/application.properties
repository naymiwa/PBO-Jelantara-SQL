spring.application.name=jelantara

# Koneksi Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jelantara
spring.datasource.username=postgres
spring.datasource.password=Berkahberlimpah9
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfigurasi JPA dan Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port Server
server.port=8080

# Konfigurasi bisnis Jelantara (bukan hardcode di kode)
jelantara.harga-per-liter=4000
jelantara.poin-per-liter=30
jelantara.ambang-kapasitas=80
